name: Build x86

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure x86
        run: cmake --preset vs2022-x86

      - name: Build
        run: cmake --build --preset vs2022-x86-relwithdebinfo

      - name: Test native D3D9 and fallback
        run: >-
          ctest --test-dir build/vs2022-x86 -C RelWithDebInfo
          --output-on-failure -E 9on12
